[/Script/EngineSettings.GameMapsSettings]
GlobalDefaultGameMode=/Script/Selene.SeleneGameMode
bOffsetPlayerGamepadIds=False

[/Script/Engine.RendererSettings]
; Substrate on for the character Toon BSDF, with the Blendable GBuffer (0). The engine default, the Adaptive/bitstream
; GBuffer (1), crashed on this Mac (UE 5.8.4, Metal SM6): PSO "float4 output not compatible with MTLPixelFormatR32Uint".
; The Toon BSDF is built on the Blendable GBuffer. See docs/INTERVENTION-LOG.md.
r.Substrate=True
r.Substrate.ProjectGBufferFormat=0
; Template rendering baseline (TP_ThirdPerson, UE 5.8.4)
r.ReflectionMethod=1
r.GenerateMeshDistanceFields=True
r.DynamicGlobalIlluminationMethod=1
r.Lumen.TraceMeshSDFs=0
r.Shadow.Virtual.Enable=1
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=true
r.AllowStaticLighting=False
; Selene additions
r.AntiAliasingMethod=4
r.SkinCache.CompileShaders=True
r.Nanite.ProjectEnabled=True
; Hardware ray tracing stays off until measured (plan section 3)
r.RayTracing=False
r.Lumen.HardwareRayTracing=False

[/Script/MacTargetPlatform.MacTargetSettings]
-TargetedRHIs=SF_METAL_SM5
+TargetedRHIs=SF_METAL_SM6
